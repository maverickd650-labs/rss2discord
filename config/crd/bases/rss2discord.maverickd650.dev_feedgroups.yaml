                    maxLength: 4096
                    minLength: 1
                    type: string
                  enabled:
                    default: false
                    description: |-
                      enabled switches a feed's messages from plain text content to a
                      Discord embed.
                    type: boolean
                  footerText:
                    description: footerText is shown in the embed's footer.
                    maxLength: 2048
                    minLength: 1
                    type: string
                  imageStyle:
                    description: |-
                      imageStyle chooses how an entry's image is shown: "thumbnail" (a small
                      image beside the description, the default) or "image" (a large image
                      below the description).
                    enum:
                    - thumbnail
                    - image
                    type: string
                type: object
              feeds:
                description: |-
                  feeds is the list of RSS feed configurations in this group. Capped at
                  maxConcurrentFetches (see feedgroup_controller.go) so a single
                  reconcile can't fan out an unbounded number of simultaneous outbound
                  fetches. RSS URLs must be unique within a group, since all per-feed
                  status (LastSeenEntry, LastSent, ETag, ...) is keyed by URL: two feeds
                  sharing a URL would silently clobber each other's status.
                items:
                  description: FeedSpec defines the configuration for a single RSS
                    feed.
                  properties:
                    embed:
                      description: |-
                        embed configures Discord embed rendering for this feed. Overrides the
                        group-level Embed config if set.
                      minProperties: 1
                      properties:
                        authorName:
                          description: authorName is shown on the embed's author line.
                          maxLength: 256
                          minLength: 1
                          type: string
                        color:
                          description: |-
                            color is the embed's side-bar color, as a hex string (e.g. "#5865F2"
                            or "5865F2").
                          maxLength: 7
                          minLength: 1
                          pattern: ^#?[0-9a-fA-F]{6}$
                          type: string
                        descriptionFormat:
                          description: |-
                            descriptionFormat is the template used to render the embed's
                            description. Supports the same placeholders as Format. Defaults to
                            "{{.Description}}".
                          maxLength: 4096
                          minLength: 1
                          type: string
                        enabled:
                          default: false
                          description: |-
                            enabled switches a feed's messages from plain text content to a
                            Discord embed.
                          type: boolean
                        footerText:
                          description: footerText is shown in the embed's footer.
                          maxLength: 2048
                          minLength: 1
                          type: string
                        imageStyle:
                          description: |-
                            imageStyle chooses how an entry's image is shown: "thumbnail" (a small
                            image beside the description, the default) or "image" (a large image
                            below the description).
                          enum:
                          - thumbnail
                          - image
                          type: string
                      type: object
                    filter:
                      description: filter defines how to filter entries from this
                        feed.
                      minProperties: 1
                      properties:
                        keywords:
                          description: keywords is a list of keywords to match (OR
                            logic).
                          items:
                            maxLength: 200
                            minLength: 1
                            type: string
                          maxItems: 50
                          minItems: 1
                          type: array
                          x-kubernetes-list-type: set
                        regex:
                          description: regex is a regular expression to match against
                            entry title/description.
                          maxLength: 1024
                          minLength: 1
                          type: string
                      type: object
                    format:
                      description: |-
                        format is the template for Discord messages for this feed.
                        Overrides the group-level format if set.
                      maxLength: 4096
                      minLength: 1
                      type: string
                    forumThreadID:
                      description: |-
                        forumThreadID posts messages into an existing forum thread/post
