      type: string
    - jsonPath: .status.conditions[?(@.type=='FeedReachable')].reason
      name: Reason
      type: string
    - jsonPath: .spec.suspend
      name: Suspended
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
