                        unset for regular text channels.
                      maxLength: 100
                      minLength: 1
                      type: string
                    paused:
                      default: false
                      description: paused stops processing this feed if set to true.
                      type: boolean
                    rssUrl:
                      description: rssUrl is the URL of the RSS feed to fetch. Only
                        http:// and https:// are supported.
                      maxLength: 2048
                      minLength: 1
                      pattern: ^https?://
                      type: string
                  required:
                  - rssUrl
                  type: object
                maxItems: 50
                minItems: 1
                type: array
                x-kubernetes-list-type: atomic
                x-kubernetes-validations:
                - message: each feed's rssUrl must be unique within a FeedGroup
                  rule: self.all(f, self.exists_one(g, g.rssUrl == f.rssUrl))
