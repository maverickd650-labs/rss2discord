## String to partially override chart.fullname template (will maintain the release name)
##
# nameOverride: ""

## String to fully override chart.fullname template
##
# fullnameOverride: ""

## Configure the controller manager deployment
##
manager:
  ## Set to false to skip manager installation
  ##
  enabled: true

  replicas: 1

  image:
    repository: ghcr.io/maverickd650-labs/rss2discord
    ## Image tag (defaults to Chart.appVersion if not set)
    ##
    # tag: ""
    pullPolicy: IfNotPresent

  ## Arguments
  ##
  args:
    - --leader-elect

  ## FeedGroups reconciled concurrently (--max-concurrent-feedgroup-reconciles).
  ## Omitted when unset, so the manager's default of 1 applies. Each extra
  ## concurrent reconcile can buffer more feed bodies at once: raise
  ## resources.limits.memory with it (see the sizing note on `resources`).
  ##
  # maxConcurrentReconciles: 1

  ## OTLP/gRPC endpoint (host:port) to export traces for outbound RSS fetches
  ## and Discord webhook requests (--otlp-endpoint). Omitted when empty, which
  ## leaves tracing disabled.
  ##
  otlpEndpoint: ""

  ## Log verbosity (--zap-log-level): debug, info, error, or an integer > 0
  ## for higher verbosity. Omitted when empty, which keeps the manager default.
  ##
  logLevel: ""

  ## Health probes.
  ## The manager serves the liveness (/healthz) and readiness (/readyz) endpoints on this port.
  ##
  healthProbe:
    # Health probe server port
    port: 8081

  ## Image pull secrets
  ##
  # imagePullSecrets:
  #   - name: myregistrykey

  ## Pod-level security settings
  ##
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  ## Container-level security settings
  ##
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true

  ## Resource limits and requests
  ##
  ## Memory sizing: one reconcile fetches up to 10 feeds at once, each response
  ## buffered up to 10MB, plus XML decode overhead, so a reconcile of large
  ## feeds can briefly hold on the order of 100-200MB; every additional
  ## concurrent reconcile (maxConcurrentReconciles) can add as much again.
  ## GOMEMLIMIT tracks limits.memory so the GC works to stay under it. Typical
  ## feeds are far smaller, so 256Mi covers a single reconcile; scale the limit
  ## with maxConcurrentReconciles and the size of your feeds.
  ##
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 64Mi

  ## Manager pod's affinity
  ##
  affinity: {}

  ## Manager pod's node selector
  ##
  nodeSelector: {}

  ## Manager pod's tolerations
  ##
  tolerations: []

  ## Deployment strategy
  ##
  # strategy:
  #   type: RollingUpdate
  #   rollingUpdate:
  #     maxSurge: 25%
  #     maxUnavailable: 25%

  ## Priority class name
  ##
  # priorityClassName: ""

  ## Topology spread constraints
  ##
  # topologySpreadConstraints: []

  ## Termination grace period seconds
  ##
  terminationGracePeriodSeconds: 10

  ## Custom Deployment labels
  ##
  # labels: {}

  ## Custom Deployment annotations
  ##
  # annotations: {}

  ## Custom Pod labels and annotations
  ##
  # pod:
  #   labels: {}
  #   annotations: {}

## RBAC configuration
##
rbac:
  ## RBAC resource scope
  ## - false (default): ClusterRole/ClusterRoleBinding (all namespaces)
  ## - true: Role/RoleBinding (release namespace only)
  ##
  namespaced: false

  ## Namespaces the operator watches for FeedGroups and their webhook Secrets.
  ## Recommended for tenant deployments; see "Restricting the operator to some
  ## namespaces" in the README, including how to verify the resulting grant.
  ## When set, the manager's permissions (including Secret get/list/watch) are
  ## granted as a Role + RoleBinding in each listed namespace instead of a
  ## ClusterRole, and the manager runs with the same --watch-namespaces. Use it
  ## for strict tenant separation: the operator's credential can then read
  ## Secrets only in these namespaces. Takes precedence over rbac.namespaced
  ## (which is shorthand for the release namespace alone).
  ##
  watchNamespaces: []

  ## Let a cluster-wide install (rbac.watchNamespaces unset, rbac.namespaced
  ## false) watch webhook Secrets, so a FeedGroup retries as soon as its
  ## Secret changes rather than on its next scheduled reconcile. This grants
  ## list/watch on every Secret in the cluster, which a stolen service-account
  ## token could use to read them all; the default keeps get-only access. A
  ## namespace-scoped install always watches, with the grant in those
  ## namespaces only.
  ##
  clusterWideSecretWatch: false

  ## Helper roles for CRD management (admin/editor/viewer)
  ##
  helpers:
    ## Install convenience admin/editor/viewer roles for CRDs
    ##
    enabled: false

## ServiceAccount configuration
##
serviceAccount:
  # Install default ServiceAccount provided
  enabled: true

  ## Existing ServiceAccount name (only used when enabled=false)
  ## Defaults to the name the chart would have created, so pre-create a
  ## ServiceAccount with that name or set this explicitly.
  ## Set to "default" to use the namespace default ServiceAccount (this grants
  ## the operator's RBAC to every pod in the namespace running under it)
  ## Note: When enabled=true, respects nameOverride/fullnameOverride
  ##
  # name: ""

  ## Custom ServiceAccount annotations
  ##
  # annotations: {}

  ## Custom ServiceAccount labels
  ##
  # labels: {}

## Custom Resource Definitions
##
crd:
  # Install CRDs with the chart
  enabled: true
  # Keep CRDs when uninstalling
  keep: false

## Controller metrics endpoint.
## Enable to expose /metrics endpoint
##
metrics:
  enabled: true
  # Metrics server port
  port: 8443
  # Enable secure metrics: HTTPS with certs/auth (true) or HTTP (false).
  # Note: Metrics authn/authz needs ClusterRole access.
  secure: true

## Cert-manager integration for TLS certificates.
## Required for metrics endpoint certificates.
##
certManager:
  enabled: false

## Prometheus ServiceMonitor for metrics scraping.
## Requires prometheus-operator to be installed in the cluster.
##
prometheus:
  enabled: false

  ## Custom ServiceMonitor labels
  ##
  # labels: {}

  ## Custom ServiceMonitor annotations
  ##
  # annotations: {}

  ## Scrape every rss2discord_* histogram (feed_request_duration_seconds,
  ## feedgroup_reconcile_duration_seconds, message_overflow_chars) as a
  ## native histogram. These metrics are exported native-only -- no classic
  ## le buckets -- so this isn't an additive "also get the native view";
  ## setting it false means Prometheus gets _count/_sum for these three
  ## metrics with no histogram_quantile resolution at all, since there are
  ## no classic buckets to fall back to.
  ## Requires a recent prometheus-operator (ServiceMonitorSpec scrapeProtocols/
  ## scrapeNativeHistograms/scrapeClassicHistograms fields, set at the top
  ## level of spec, not per-endpoint) and a Prometheus server with native
  ## histogram support (stable since v3.8). On an older prometheus-operator
  ## whose ServiceMonitor CRD predates these fields, kubectl/Helm's default
  ## strict field validation will reject the apply with an "unknown field"
  ## error rather than silently pruning it — set this to false on such a
  ## cluster (accepting the loss of histogram resolution) instead of relying
  ## on pruning.
  scrapeNativeHistograms: true

## PrometheusRule alerting on the rss2discord_feed_operations_total metric.
## Requires prometheus-operator to be installed in the cluster.
##
prometheusRule:
  enabled: false
  ## Window over which fetch_error/send_error/rate_limited rates are evaluated
  ##
  rateInterval: 15m
  ## How long an outcome must persist before the alert fires
  ##
  for: 15m
  ## How long a feed must keep reporting rss2discord_feed_healthy == 0 before
  ## RSS2DiscordFeedUnhealthy fires. That gauge comes from the feed's persisted
  ## status, so unlike the rate-based alerts above it keeps firing while a
  ## feed is in permanent backoff (retried every 10m, 20m ... up to 6h).
  ##
  unhealthyFor: 30m
  ## RSS2DiscordFeedStale fires when a feed's last successful check
  ## (rss2discord_feed_last_checked_timestamp_seconds) is older than this many
  ## SECONDS (a plain number, not a duration string: it is rendered straight
  ## into the PromQL expression). Default 21600 = 6h. Set it above the largest
  ## spec.interval of any FeedGroup and above the 6h maximum permanent backoff,
  ## or healthy-but-slow feeds will alert. Paused and never-checked feeds have
  ## no series and so never alert.
  ##
  staleAfterSeconds: 21600
  ## Severity label applied to all generated alerts
  ##
  severity: warning
  ## Extra labels added to the PrometheusRule (e.g. to match a Prometheus ruleSelector)
  ##
  # labels: {}

## Grafana dashboard for rss2discord-operator's feed metrics.
## Rendered as a GrafanaDashboard custom resource for the grafana-operator
## (https://github.com/grafana/grafana-operator), which syncs it into any
## matching Grafana instance.
##
grafanaDashboard:
  enabled: false
  ## Namespace for the ConfigMap and GrafanaDashboard CR (defaults to the
  ## release namespace).
  ##
  # namespace: ""
  ## Lets the GrafanaDashboard CR (in this release's namespace) be picked up
  ## by a Grafana CR in a different namespace.
  ##
  allowCrossNamespaceImport: true
  ## Label selector matching the target Grafana custom resource(s). Left
  ## empty (the default), the grafana-operator matches every Grafana CR it
  ## manages.
  ##
  instanceSelector:
    matchLabels: {}
  ## How often the operator re-syncs this dashboard into Grafana.
  ##
  resyncPeriod: 30s
  ## Grafana folder to file the dashboard under. Leave unset for the default
  ## folder.
  ##
  # folder: ""
  ## Maps the dashboard's ${DS_PROMETHEUS} placeholder to a real datasource,
  ## by name, before the operator pushes the dashboard into Grafana. Adjust
  ## datasourceName to match your Prometheus datasource's name in Grafana.
  ##
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: prometheus
  ## Extra labels and annotations added to the ConfigMap and GrafanaDashboard CR
  ##
  # labels: {}
  # annotations: {}

## Network policies for controlling traffic flow.
## Enable to restrict ingress to the controller manager.
##
networkPolicy:
  enabled: false

