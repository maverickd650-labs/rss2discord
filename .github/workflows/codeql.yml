name: CodeQL

on:
  push:
    branches: [main]
  merge_group:
  pull_request:
  schedule:
    # Weekly scan to catch advisories published after the last code change.
    - cron: "27 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  analyze:
    name: Analyze (go)
    runs-on: ubuntu-latest
    permissions:
      security-events: write # to upload SARIF results to code scanning
      contents: read # to checkout the code
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Use actions/setup-go rather than mise here: CodeQL's build tracer needs a
      # real `go` binary on PATH, and mise exposes `go` as a shim the tracer
      # can't follow (yields "no source code seen"). Version tracks go.mod.
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: go
          build-mode: autobuild
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:go"
          # The queue's gh-readonly-queue ref is ephemeral and its results add
          # nothing to the PR and main runs, so analyze without uploading there
          # (the check still fails if the analysis itself fails).
          upload: ${{ github.event_name == 'merge_group' && 'never' || 'always' }}
