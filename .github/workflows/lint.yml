name: Lint

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    permissions:
      contents: read
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go environment
        uses: ./.github/actions/setup-go-env

      - name: Cache custom golangci-lint binary
        id: golangci-lint-custom-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/golangci-lint-custom
          # .mise/config.toml pins the Go toolchain the binary is built with; a
          # binary built by an older Go refuses to lint a module whose go
          # directive is newer, so a toolchain bump must invalidate this cache.
          key: ${{ runner.os }}-golangci-lint-custom-${{ hashFiles('.custom-gcl.yml', '.mise/config.toml') }}

      - name: Mark restored binary fresh
        # mise's `golangci-lint-custom` task skips rebuilding when its output is newer
        # than its sources (.custom-gcl.yml, .mise/config.toml); checkout always gives those a fresh mtime, so without
        # this the cache hit would still trigger a rebuild every run.
        if: steps.golangci-lint-custom-cache.outputs.cache-hit == 'true'
        run: touch bin/golangci-lint-custom

      - name: Check linter configuration
        run: mise run lint-config

      - name: Run linter
        shell: bash
        run: |
          set +e
          mise run lint 2>&1 | tee lint.out
          status=${PIPESTATUS[0]}
          grep -E '\.go:[0-9]+:[0-9]+' lint.out | head -40 | while IFS= read -r l; do echo "::error::${l}"; done
          grep -vE '^\s*$' lint.out | tail -8 | while IFS= read -r l; do echo "::warning::${l}"; done
          exit $status
