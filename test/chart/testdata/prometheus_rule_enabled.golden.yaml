---
# Source: rss2discord-operator/templates/prometheus/prometheus-rule.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: chart-golden-test-rss2discord-operator-alerts
  namespace: chart-golden-test-ns
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: rss2discord-operator
    helm.sh/chart: SCRUBBED
    app.kubernetes.io/instance: chart-golden-test
    control-plane: controller-manager
spec:
  groups:
  - name: rss2discord-operator.feedgroups
    rules:
    - alert: RSS2DiscordFeedFetchErrors
      expr: |-
        label_replace(
          sum by (namespace, name, rss_url, outcome) (
            rate(rss2discord_feed_operations_total{outcome=~"fetch_error_.+"}[15m])
          ),
          "reason", "$1", "outcome", "fetch_error_(.+)"
        ) > 0
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: FeedGroup {{ $labels.namespace }}/{{ $labels.name }} is failing to fetch feed {{ $labels.rss_url }}
        description: >-
          FeedGroup {{ $labels.namespace }}/{{ $labels.name }}
          has had sustained RSS fetch errors on feed {{ $labels.rss_url }}
          (reason: {{ $labels.reason }}) for at least 15m.
          Check the feed URL, network egress, and the FeedGroup status conditions.
    - alert: RSS2DiscordFeedRateLimited
      expr: |-
        sum by (namespace, name, rss_url) (
          rate(rss2discord_feed_operations_total{outcome="rate_limited"}[15m])
        ) > 0
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: FeedGroup {{ $labels.namespace }}/{{ $labels.name }} is being rate limited by Discord
        description: >-
          FeedGroup {{ $labels.namespace }}/{{ $labels.name }}
          has been rate limited by Discord while sending feed {{ $labels.rss_url }}
          for at least 15m.
          Posts are being delayed; consider reducing the polling frequency or splitting the feed.
    - alert: RSS2DiscordFeedSendErrors
      expr: |-
        label_replace(
          sum by (namespace, name, rss_url, outcome) (
            rate(rss2discord_feed_operations_total{outcome=~"send_error_.+"}[15m])
          ),
          "reason", "$1", "outcome", "send_error_(.+)"
        ) > 0
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: FeedGroup {{ $labels.namespace }}/{{ $labels.name }} is failing to send feed {{ $labels.rss_url }} to Discord
        description: >-
          FeedGroup {{ $labels.namespace }}/{{ $labels.name }}
          has had sustained Discord send errors on feed {{ $labels.rss_url }}
          (reason: {{ $labels.reason }}) for at least 15m.
          Check the webhook URL and the FeedGroup status conditions.
    - alert: RSS2DiscordFeedEntriesSkipped
      expr: |-
        sum by (namespace, name, rss_url) (
          increase(rss2discord_feed_operations_total{outcome="skipped"}[15m])
        ) > 0
      labels:
        severity: warning
      annotations:
        summary: FeedGroup {{ $labels.namespace }}/{{ $labels.name }} gave up on an entry from feed {{ $labels.rss_url }}
        description: >-
          FeedGroup {{ $labels.namespace }}/{{ $labels.name }}
          skipped an entry from feed {{ $labels.rss_url }} after exhausting its retries
          because it could not be rendered with the feed's template, so it was not delivered.
          See the FeedGroup's Warning Events and Delivered condition for the entry and cause.
    - alert: RSS2DiscordFeedUnhealthy
      expr: rss2discord_feed_healthy == 0
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: Feed {{ $labels.rss_url }} in FeedGroup {{ $labels.namespace }}/{{ $labels.name }} is unhealthy
        description: >-
          Feed {{ $labels.rss_url }} in FeedGroup {{ $labels.namespace }}/{{ $labels.name }}
          has reported an error for at least 30m.
          Unlike the error-rate alerts this is driven by the feed's persisted status,
          so it keeps firing while the feed is in permanent backoff and retried only
          every few hours. Check the FeedGroup's status conditions for the cause.
    - alert: RSS2DiscordFeedStale
      expr: time() - rss2discord_feed_last_checked_timestamp_seconds > 21600
      labels:
        severity: warning
      annotations:
        summary: Feed {{ $labels.rss_url }} in FeedGroup {{ $labels.namespace }}/{{ $labels.name }} has not been checked successfully recently
        description: >-
          Feed {{ $labels.rss_url }} in FeedGroup {{ $labels.namespace }}/{{ $labels.name }}
          has not had a successful check for more than 21600 seconds.
          Check that the operator is running and the FeedGroup's interval is shorter than this threshold.
